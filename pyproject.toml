[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "torx-layers"
version = "0.0.0"
description = "Thermodynamics-aware stochastic layers for Extropic TorX."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Albert Buchard" }]
keywords = [
  "energy-based-models",
  "jax",
  "probabilistic-circuits",
  "stochastic-computing",
  "thermodynamic-computing",
  "torx",
]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
torx = ["extro-torx>=0.0.1,<0.1"]
dev = [
  "build>=1.3,<2",
  "pre-commit>=4.2,<5",
  "pyright>=1.1.408,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.6,<10",
]

[project.urls]
Documentation = "https://github.com/albertbuchard/torx-layers/tree/main/docs"
Issues = "https://github.com/albertbuchard/torx-layers/issues"
Repository = "https://github.com/albertbuchard/torx-layers"
TorX = "https://github.com/extropic-ai/torx"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/torx_layers"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["A", "ANN", "B", "C4", "D", "E", "F", "I", "N", "PERF", "RUF", "SIM", "UP", "W"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src", "tests"]
exclude = ["build", "dist"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=torx_layers --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["torx_layers"]

[tool.coverage.report]
fail_under = 100
show_missing = true
